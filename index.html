<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bzzz — Le monde des abeilles</title>
<style>
:root{--c:#f57c00;--ink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--c);color:var(--ink);font-family:"Montserrat","Segoe UI",system-ui,sans-serif;min-height:100vh;transition:background-color .9s ease;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 35%,rgba(255,255,255,.28),transparent 60%),linear-gradient(180deg,transparent 55%,rgba(0,0,0,.22));pointer-events:none}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;margin:14px auto 0;width:max-content;max-width:94%;overflow-x:auto;padding:6px;border-radius:40px;background:rgba(60,25,0,.35);backdrop-filter:blur(10px);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{all:unset;cursor:pointer;white-space:nowrap;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:9px 14px;border-radius:30px;color:#fff;transition:.4s}
nav button.on{background:#fff;color:#7a3500}
main{position:relative;max-width:980px;margin:0 auto;padding:18px 22px 150px;display:grid;gap:10px;align-items:center}
@media(min-width:760px){main{grid-template-columns:1fr 1fr;min-height:80vh}}
.panel{transition:opacity .5s,transform .5s}.panel.out{opacity:0;transform:translateY(14px)}
.stage{position:relative;display:grid;place-items:center;min-height:300px}
.stage .big{width:min(78vw,380px);animation:float 4s ease-in-out infinite;filter:drop-shadow(0 28px 18px rgba(0,0,0,.28))}
.stage .mini{position:absolute;width:26%;opacity:.9;animation:float 3.2s ease-in-out infinite}
.m1{left:2%;top:8%;animation-delay:-1s!important}.m2{right:2%;bottom:6%;animation-delay:-2s!important}
@keyframes float{50%{transform:translateY(-14px) rotate(2deg)}}
.wing{transform-origin:center;animation:flap .25s infinite alternate}@keyframes flap{to{transform:scaleY(.8)}}
.kicker{font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.8}
h1{font-family:Georgia,"Playfair Display",serif;font-size:clamp(34px,7vw,56px);line-height:1.05;margin:8px 0 14px;font-weight:700}
p.lead{font-size:17px;line-height:1.7;opacity:.96;max-width:52ch;margin-bottom:10px}
.stats{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:18px;padding:12px 16px;min-width:96px}
.stat b{display:block;font-size:26px}.stat span{font-size:13px;opacity:.9}
.cap{margin-top:22px;font-size:18px;opacity:.9;font-style:italic}
.cards{display:grid;gap:10px;margin-top:16px}
.card{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.16);border-radius:20px;padding:12px 16px;font-size:15px;line-height:1.5}
.card svg{width:68px;flex:none}.card b{display:block;font-size:16px;margin-bottom:2px}
.chart{margin-top:18px;background:rgba(0,0,0,.16);border-radius:22px;padding:16px 14px 10px}
.bars{display:flex;align-items:flex-end;gap:5px;height:150px}
.bar{flex:1;border-radius:8px 8px 3px 3px;background:#fff;height:0;transition:height 1s cubic-bezier(.2,.8,.2,1);position:relative;cursor:pointer}
.bar.w{background:#bfe3ff}.bar:hover::after,.bar.show::after{content:attr(data-v);position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;white-space:nowrap}
.mo{display:flex;gap:5px;margin-top:6px;font-size:12px;text-align:center;opacity:.8}.mo i{flex:1;font-style:normal}
.legend{font-size:13px;margin-top:8px;opacity:.9}
nav{margin-top:52px;top:calc(env(safe-area-inset-top,0px) + 52px)}
@media(min-width:900px){nav{margin-top:14px;top:env(safe-area-inset-top,0px)}}
.stat,.card,.chart,.stage .big,.stage .mini{transition:scale .35s ease,background .35s}
.stat:hover,.card:hover{scale:1.05;background:rgba(255,255,255,.28)}.chart:hover{scale:1.03}.stage .big:hover{scale:1.08}.stage .mini:hover{scale:1.15}
#frise{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:56px 38px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,rgba(40,15,0,.5),transparent);pointer-events:none}
.trk{position:relative;height:6px;pointer-events:auto}
.line{position:absolute;inset:0;border-radius:6px;background:rgba(255,255,255,.3)}
.line::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--pg,0%);background:#fff;border-radius:6px;transition:width .9s ease}
.dot{all:unset;position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:rgba(255,255,255,.4);border:2px solid #fff;cursor:pointer;transition:.5s}.dot.d{background:#fff}.dot:hover{scale:1.4}
#rider{position:absolute;bottom:8px;width:48px;margin-left:-24px;transition:left .9s cubic-bezier(.5,0,.2,1);pointer-events:none;animation:hop .6s infinite alternate ease-in-out}
#rider svg{width:100%;display:block}@keyframes hop{to{transform:translateY(-6px)}}
#mus{all:unset;cursor:pointer;position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:7;background:#fff;color:#7a3500;font-size:12px;font-weight:700;padding:9px 14px;border-radius:30px;box-shadow:0 6px 16px rgba(0,0,0,.25);transition:scale .3s}#mus:hover{scale:1.08}
#fix{}
.sizes{display:flex;align-items:flex-end;justify-content:space-around;gap:6px;margin:16px 0 14px;background:rgba(0,0,0,.14);border-radius:22px;padding:18px 8px 12px}
.sizes>div{text-align:center;font-size:13px;line-height:1.35;transition:scale .3s}.sizes>div:hover{scale:1.1}.sizes b{font-size:15px}
.qt{font-family:Georgia,serif;font-size:25px;margin:10px 0 14px;line-height:1.3}
.opt{all:unset;cursor:pointer;display:block;background:rgba(255,255,255,.18);border-radius:18px;padding:14px 16px;font-size:16px;line-height:1.4;transition:scale .3s,background .3s}.opt:hover{scale:1.03;background:rgba(255,255,255,.3)}.opt.ok{background:#2e9e5b}.opt.ko{background:#c0392b}
.btn{all:unset;cursor:pointer;margin-top:12px;background:#fff;color:#7a3500;font-weight:700;font-size:15px;padding:12px 22px;border-radius:30px;display:inline-block;transition:scale .3s}.btn:hover{scale:1.06}
#nm{font:inherit;font-size:16px;color:#fff;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.7);border-radius:30px;padding:11px 18px;outline:none;min-width:200px;margin:6px 8px 0 0}#nm::placeholder{color:rgba(255,255,255,.8)}
#dp canvas{width:100%;max-width:560px;border-radius:12px;margin-top:16px;box-shadow:0 12px 30px rgba(0,0,0,.35);display:block}
#fix2{}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px;margin-top:14px}
.cd{perspective:800px;aspect-ratio:3/4;cursor:pointer;transition:scale .3s}.cd:hover{scale:1.06}
.cd .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}.cd.f .in{transform:rotateY(180deg)}
.cd .fr,.cd .bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:3px solid #fff;color:#fff;box-shadow:0 8px 18px rgba(0,0,0,.25)}
.cd .bk{transform:rotateY(180deg)}.cd .col{background:var(--k)}.cd .hide{background:#3b2412;color:#f5b81c;border-color:#f5b81c}.cd .hb{font-size:54px}
.cd .cream{background:#fffaf0;color:#3b2412;border-color:var(--k)}.cd .cream small{color:var(--k);font-weight:700}
.cd svg{width:70%}.cd b{font-size:15px;margin-top:4px}.cd p{font-size:12.5px;line-height:1.35;margin:4px 0}.cd small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.cd.ok .bk{box-shadow:0 0 0 4px #fff}.btn.off{background:rgba(255,255,255,.25);color:#fff}
</style></head><body>

const T=[
{id:"Ruche",c:"#f57c00",k:"Bienvenue",t:"Un royaume de cire et de douceur",d:"Une ruche, c’est une seule grande famille qui pense, travaille et se réchauffe ensemble. Explorez chaque onglet pour découvrir leur monde.",a:"none",m:["flower","pot"],x:st("50 000","abeilles en été")+st("35 °C","au cœur du couvain")+st("1","seule reine"),cap:"Confiance, tissée dans la cire.",e:"Une colonie vit dans une cavité qu’elle tapisse de propolis, une résine antibactérienne. Jour et nuit, elle y maintient une température et une humidité stables, comme un seul organisme : on parle de « superorganisme ».",f:[["flower","Pollinisatrices essentielles","Environ un tiers de notre alimentation dépend de la pollinisation par les insectes."],["pot","Un trésor fragile","Pesticides, manque de fleurs et maladies fragilisent les colonies. Planter des fleurs mellifères aide."]]},
{id:"Communauté",c:"#e09a00",k:"Vivre ensemble",t:"Une société sans chef… ou presque",d:"La reine pond, mais ce sont les ouvrières qui décident collectivement : où s’installer, quand essaimer, qui nourrir. Chacune change de métier en grandissant.",a:"crown",m:["flower","scarf"],x:st("~21 j","d’œuf à ouvrière")+st("6 sem.","de vie en été")+st("6 mois","de vie en hiver"),cap:"Ensemble, on va plus loin.",e:"Chaque ouvrière change de métier avec l’âge : nettoyeuse, nourrice, cirière, magasinière, gardienne, puis butineuse. Cette rotation adapte la ruche à ses besoins sans aucun ordre venu d’en haut.",f:[["scarf","Une grande famille","Les abeilles se reconnaissent à l’odeur de la colonie : les intruses sont refoulées à l’entrée par les gardiennes."],["crown","L’essaimage","Au printemps, la vieille reine part avec la moitié des abeilles fonder une nouvelle colonie ; une jeune reine prend sa place."]]},
{id:"Communication",c:"#d9552b",k:"Langage",t:"Danser pour se faire comprendre",d:"Une butineuse qui a trouvé un champ de fleurs revient danser : l’angle de la danse indique la direction par rapport au soleil, la durée du frétillement la distance. Les phéromones et les vibrations complètent le message.",a:"mega",m:["flower","hex"],x:st("8","figure de la danse frétillante")+st("100 %","des échanges en odeurs & vibrations"),cap:"Bzzz = « suivez-moi ! »",e:"Les abeilles échangent aussi de la nourriture de bouche en bouche (trophallaxie), ce qui diffuse odeurs et informations dans toute la colonie. En cas d’alerte, les gardiennes libèrent une phéromone qui rassemble les défenseuses.",f:[["flower","La danse en 8","Une danse à 30° de la verticale signifie : source à 30° à droite du soleil. Plus elle dure, plus la source est loin."],["crown","La phéromone royale","Elle signale que la reine est présente et en bonne santé : sans elle, la colonie le sent en quelques heures."]]},
{id:"Miel",c:"#c27a08",k:"Or liquide",t:"Du nectar au miel",d:"Le nectar, riche en eau, est ramené au jabot, transmis de bouche en bouche, puis ventilé par les ailes jusqu’à devenir miel et être operculé dans les alvéoles.",a:"pot",m:["flower","hex"],x:st("~2 M","de fleurs pour 1 kg")+st("1/12","de cuillère par abeille, à vie")+st("~17 %","d’eau dans le miel mûr"),cap:"Douceur, conservée pour l’hiver.",e:"Le goût dépend des fleurs butinées : acacia, lavande, tilleul, châtaignier, sarrasin… Le miel se conserve grâce à sa faible teneur en eau et à une enzyme qui le rend naturellement antibactérien.",f:[["pot","Réserve d’hiver","Une colonie consomme 15 à 20 kg de miel pour traverser la saison froide."],["flower","Autres trésors","Cire, propolis, gelée royale et pollen : la ruche produit bien plus que du miel."]]},
{id:"Rôles",c:"#b0502a",k:"Qui fait quoi",t:"Trois castes, des dizaines de métiers",d:"",a:"crown",m:["scarf","flower"],x:"",cap:"",roles:1,f:[["scarf","Les métiers de l’ouvrière","Nettoyage → nourrice → cirière → gardienne → butineuse : une carrière complète en quelques semaines."]]},
{id:"Saisons",c:"#4f8a78",k:"Été & hiver",t:"La population respire avec l’année",d:"En été la colonie gonfle pour butiner. En hiver, elle se resserre en grappe autour de la reine et se relaie pour produire de la chaleur.",a:"scarf",m:["flower","hex"],x:"",cap:"",chart:1,e:"En hiver, les abeilles n’hibernent pas : elles font vibrer leurs muscles de vol pour se réchauffer et tournent de l’extérieur (froid) vers le cœur de la grappe. Les mâles sont chassés à l’automne pour économiser les réserves.",f:[["scarf","Hiver","La reine ralentit, voire arrête de pondre. Les abeilles d’hiver, plus longévives, vivent plusieurs mois."],["flower","Été","Pic de ponte, de butinage et de miellée : jusqu’à 60 000 abeilles par ruche."]]},
{id:"Organisation",c:"#8a5a3c",k:"Architecture",t:"Une ville en hexagones",d:"Le couvain occupe le centre, le plus chaud. Autour, un anneau de pollen (le « pain d’abeille »), puis les réserves de miel en haut. Les cires forment des alvéoles hexagonales, la forme la plus économe.",a:"hex",m:["pot","flower"],x:st("Centre","couvain : œufs & larves")+st("Anneau","pollen")+st("Haut","réserves de miel"),cap:"Chaque cellule a sa place.",e:"La ruche à cadres moderne reprend cette organisation naturelle : corps de ruche pour le couvain, hausses au-dessus pour le miel récolté par l’apiculteur.",f:[["hex","Pourquoi l’hexagone ?","C’est la forme qui utilise le moins de cire pour stocker le plus de miel, sans espace perdu."],["pot","La porte d’entrée","Le trou de vol est gardé et sert de piste d’atterrissage aux butineuses chargées de pollen."]]}

,{id:"Cousins",c:"#6b7d2a",k:"Qui est qui ?",t:"Abeille, bourdon, guêpe, frelon : ne les confondons plus",d:"Quatre insectes rayés que l’on mélange souvent. Pourtant, leur silhouette, leur régime et leur caractère sont très différents.",e:"Observez de loin, sans geste brusque : la plupart ne piquent que si elles se sentent menacées.",a:"none",m:["mega","flower"],x:st("1 fois","l’abeille pique, puis meurt")+st("2004","1re détection du frelon asiatique en France"),cap:"Bien les reconnaître, c’est mieux les protéger.",cmp:1},

const M="JFMAMJJASOND".split(""),V=[12,10,14,25,40,55,60,58,45,30,18,12];
const nav=document.getElementById("nav"),p=document.getElementById("p"),s=document.getElementById("s");
function body(t){
 if(t.cards)return `<p class="lead">${t.d}</p><div><button class="btn" id="m1" style="margin-right:8px">Collection</button><button class="btn off" id="m2">Memory</button></div><div id="cg"></div>`;

 if(t.cmp)return `<p class="lead">${t.d}</p><p class="lead">${t.e||""}</p>${sizes()}<div class="cards">${hv("none","L’abeille (Apis mellifera)","1,2–1,5 cm, brun doré, légèrement duveteuse. Nectar et pollen, miel et cire. 20 000 à 60 000 par colonie. Ne pique qu’en dernier recours : son dard crocheté reste dans la peau.")}${hv("none","Le bourdon","1–2,5 cm, gros, rond et très velu. Nid en terre de 50 à 500 individus. Pollinise même par temps frais en faisant vibrer les fleurs. Peu agressif.","bumble")}${hv("none","La guêpe commune","1–2 cm, lisse, taille très fine, jaune vif et noir. Carnivore et gourmande de sucre. Nid en papier mâché. Peut piquer plusieurs fois, surtout en fin d’été.","wasp")}${hv("none","Le frelon asiatique","2–3 cm, thorax sombre, une seule bande jaune-orangé sur l’abdomen, pattes jaunes, tête orangée. Chasse les abeilles devant la ruche ; nid sphérique souvent haut dans les arbres. Ne pas s’en approcher : signaler le nid aux autorités locales.","hornet")}</div><div class="stats">${t.x}</div><p class="cap">${t.cap}</p>`;
 if(t.roles)return `<div class="cards">${hv("crown","La reine","Une seule par ruche. Elle peut pondre jusqu’à 2 000 œufs par jour et diffuse les phéromones qui unissent la colonie.")}${hv("flower","Les ouvrières (20 000–60 000)","Des femelles : nettoyeuses, nourrices, bâtisseuses, gardiennes puis butineuses.")}${hv("mega","Les faux-bourdons (0–2 000)","Les mâles : ils servent à la reproduction, sont chassés avant l’hiver.")}</div>`;
 if(t.chart)return `<p class="lead">${t.d}</p><p class="lead">${t.e||""}</p><div class="chart"><div class="bars">${V.map((v,i)=>`<div class="bar ${i<2||i>9?"w":""}" data-v="${v} 000" data-h="${v/60*100}"></div>`).join("")}</div><div class="mo">${M.map(m=>`<i>${m}</i>`).join("")}</div><div class="legend">Ouvrières par ruche (milliers) — ordre de grandeur · bleu : hiver</div></div><div class="stats">${st("~50 000","été · 1 reine · ~1 500 mâles")+st("~15 000","hiver · 1 reine · 0 mâle")}</div>`;
 return `<p class="lead">${t.d}</p><p class="lead">${t.e||""}</p><div class="stats">${t.x}</div><p class="cap">${t.cap}</p>`}
const sizes=()=>`<div class="sizes">${[["none",1.3,"Abeille"],["bumble",1.8,"Bourdon"],["wasp",1.5,"Guêpe"],["hornet",2.5,"Frelon asiatique"]].map(a=>`<div><div style="width:${a[1]*34}px;margin:auto">${bee("none","#fff",a[0]=="none"?undefined:a[0])}</div><b>${String(a[1]).replace(".",",")} cm</b><br>${a[2]}</div>`).join("")}</div><div class="legend" style="margin:-6px 0 14px">Tailles moyennes, à l’échelle relative.</div>`;
const Q=[
["Combien de reines vivent dans une ruche ?",["Deux","Une dizaine","Une seule","Une par ouvrière"],2,"Une seule reine, qui peut pondre jusqu’à 2 000 œufs par jour."],
["Dans la danse frétillante, qu’indique la durée du frétillement ?",["La direction","La distance de la source","Le danger","La couleur des fleurs"],1,"L’angle donne la direction, la durée donne la distance."],
["Combien de fleurs faut-il environ pour produire 1 kg de miel ?",["20 000","200 000","2 millions","20 millions"],2,"Environ 2 millions de fleurs butinées."],
["Que font les abeilles en hiver ?",["Elles forment une grappe et frissonnent pour se réchauffer","Elles hibernent seules dans leur alvéole","Elles migrent vers le sud","Elles quittent la ruche"],0,"Elles n’hibernent pas : elles se relaient dans la grappe autour de la reine."],
["Qui est chassé de la ruche avant l’hiver ?",["Les nourrices","Les faux-bourdons","Les gardiennes","La reine"],1,"Les mâles ne travaillent pas : on les chasse pour économiser les réserves."],
["Quel insecte est gros, rond, très velu, et pollinise par vibration ?",["La guêpe","Le frelon asiatique","La mouche","Le bourdon"],3,"Le bourdon, peu agressif et très utile même par temps frais."]];
const CF=[
["Une ruche est un superorganisme : environ 50 000 abeilles pour 1 reine en été.","Un tiers de notre alimentation dépend de la pollinisation."],
["Les ouvrières changent de métier avec l’âge : nettoyeuse, nourrice, puis butineuse.","Au printemps, la vieille reine part essaimer avec la moitié de la colonie."],
["Danse frétillante : l’angle indique la direction, la durée indique la distance.","Phéromones, vibrations et échanges de nourriture complètent ce langage."],
["Il faut environ 2 millions de fleurs pour produire 1 kg de miel.","Une colonie consomme 15 à 20 kg de miel pour passer l’hiver."],
["La reine pond jusqu’à 2 000 œufs par jour.","Les faux-bourdons, mâles, sont chassés avant l’hiver."],
["Été : jusqu’à 60 000 abeilles. Hiver : environ 15 000, en grappe.","En hiver, elles frissonnent pour se réchauffer, sans hiberner."],
["Couvain au centre, pollen autour, miel en haut.","L’hexagone économise la cire et ne perd aucune place."],
["Abeille 1,3 cm, bourdon 1,8 cm, guêpe 1,5 cm, frelon asiatique 2,5 cm.","Frelon asiatique : une seule bande jaune-orangé. À signaler, jamais à détruire soi-même."]];
const cd=(k,fr,bk,fc,bc,n)=>`<div class="cd" data-n="${n??""}" style="--k:${k}"><div class="in"><div class="fr ${fc}">${fr}</div><div class="bk ${bc}">${bk}</div></div></div>`;
let cmode=0;
function startCards(){const a=document.getElementById("m1"),b=document.getElementById("m2");a.onclick=()=>{cmode=0;cg()};b.onclick=()=>{cmode=1;cg()};cg()}
function cg(){const el=document.getElementById("cg");document.getElementById("m1").classList.toggle("off",cmode!==0);document.getElementById("m2").classList.toggle("off",cmode!==1);
 if(cmode===0){el.innerHTML=`<p class="lead" style="margin-top:14px">Touchez une carte pour la retourner. Une couleur par thème, comme sur le site.</p><div class="grid">${CF.flatMap((fs,i)=>fs.map(x=>cd(T[i].c,`<small>${T[i].k}</small>${bee(T[i].a)}<b>${T[i].id}</b>`,`<small>${T[i].id}</small><p>${x}</p>`,"col","cream"))).join("")}</div>`;
  el.querySelectorAll(".cd").forEach(d=>d.onclick=()=>d.classList.toggle("f"));return}
 const t=[];CF.forEach((f,i)=>{t.push({i,k:0});t.push({i,k:1})});t.sort(()=>Math.random()-.5);
 let open=[],moves=0,done=0,busy=false;
 el.innerHTML=`<p class="lead" id="mi" style="margin-top:14px"></p><div class="grid">${t.map((c,n)=>cd(T[c.i].c,`<span class="hb">⬡</span>`,c.k?`<p>${CF[c.i][0]}</p>`:`${bee(T[c.i].a)}<b>${T[c.i].id}</b>`,"hide","col",n)).join("")}</div>`;
 const mi=document.getElementById("mi"),info=()=>mi.textContent=`Associez chaque thème à son information clé. Coups : ${moves}`;info();
 el.querySelectorAll(".cd").forEach(d=>d.onclick=()=>{if(busy||d.classList.contains("f"))return;d.classList.add("f");open.push(d);
  if(open.length<2)return;moves++;busy=true;const[a,b]=open;
  if(t[+a.dataset.n].i===t[+b.dataset.n].i){a.classList.add("ok");b.classList.add("ok");open=[];busy=false;done++;
   if(done===8){mi.innerHTML=`Bravo ! Tout est associé en ${moves} coups. <button class="btn" id="rp" style="margin:0 0 0 8px">Rejouer</button>`;document.getElementById("rp").onclick=cg;return}}
  else setTimeout(()=>{a.classList.remove("f");b.classList.remove("f");open=[];busy=false},1000);
  if(done<8)info()})}
let qi=0,sc=0;
function startQuiz(){qi=0;sc=0;qz()}
function qz(){const el=document.getElementById("qz");if(!el)return;if(qi>=Q.length)return res(el);
 const q=Q[qi];let lock=false;
 el.innerHTML=`<div class="kicker">Question ${qi+1} / ${Q.length}</div><h2 class="qt">${q[0]}</h2><div class="cards">${q[1].map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}</div><div id="fb"></div>`;
 const bs=el.querySelectorAll(".opt");
 bs.forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const i=+b.dataset.i;if(i===q[2])sc++;
  bs[q[2]].classList.add("ok");if(i!==q[2])b.classList.add("ko");
  document.getElementById("fb").innerHTML=`<p class="lead" style="margin-top:14px">${i===q[2]?"Bravo ! ":"Pas tout à fait. "}${q[3]}</p><button class="btn" id="nx">${qi===Q.length-1?"Voir mon résultat":"Suivant"}</button>`;
  document.getElementById("nx").onclick=()=>{qi++;qz()}})}
function res(el){
 if(sc>=5){el.innerHTML=`<h2 class="qt">${sc} / 6 — Bravo, happy-culteur !</h2><p class="lead">Vous avez remporté le diplôme. Écrivez votre nom pour le créer.</p><input id="nm" placeholder="Votre nom" maxlength="30"><button class="btn" id="mk">Créer mon diplôme</button><div id="dp"></div>`;
  document.getElementById("mk").onclick=async()=>{const n=document.getElementById("nm").value.trim();if(!n){document.getElementById("nm").focus();return}
   const c=await dip(n,sc);const dp=document.getElementById("dp");dp.innerHTML="";dp.appendChild(c);
   const b=document.createElement("button");b.className="btn";b.textContent="Télécharger mon diplôme";b.onclick=()=>dl(c);dp.appendChild(b)}
 }else{el.innerHTML=`<h2 class="qt">${sc} / 6</h2><p class="lead">Presque ! Il faut au moins 5 bonnes réponses. Relisez les onglets et retentez votre chance.</p><button class="btn" id="rt">Rejouer</button>`;document.getElementById("rt").onclick=startQuiz}}
const img=(svg)=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg.replace("<svg ",'<svg width="400" height="400" '))});
async function dip(name,score){
 const c=document.createElement("canvas");c.width=1200;c.height=850;const x=c.getContext("2d");
 const [b1,b2,b3]=await Promise.all([img(bee("crown")),img(bee("pot")),img(bee("flower"))]);
 x.fillStyle="#fff6dc";x.fillRect(0,0,1200,850);
 x.fillStyle="rgba(245,160,0,.12)";for(let i=0;i<9;i++)for(let j=0;j<7;j++){const cx=90+i*125+(j%2)*62,cy=110+j*110;x.beginPath();for(let k=0;k<6;k++){const a=Math.PI/3*k+Math.PI/6;x.lineTo(cx+48*Math.cos(a),cy+48*Math.sin(a))}x.closePath();x.fill()}
 x.strokeStyle="#e08a00";x.lineWidth=14;x.strokeRect(30,30,1140,790);x.strokeStyle="#3b2412";x.lineWidth=3;x.strokeRect(54,54,1092,742);
 x.drawImage(b1,500,64,200,200);x.drawImage(b2,110,500,190,190);x.drawImage(b3,900,500,190,190);
 x.textAlign="center";x.fillStyle="#3b2412";
 x.font="bold 82px Georgia,serif";x.fillText("DIPLÔME",600,350);
 x.fillStyle="#c77d0a";x.font="italic 46px Georgia,serif";x.fillText("de Happy-culteur",600,412);
 x.fillStyle="#3b2412";x.font="26px Georgia,serif";x.fillText("décerné à",600,472);
 let fs=76;do{x.font="bold "+fs+"px Georgia,serif";fs-=4}while(x.measureText(name).width>620&&fs>24);
 x.fillStyle="#b0502a";x.fillText(name,600,560);x.fillStyle="#3b2412";x.fillRect(330,580,540,3);
 x.font="26px Georgia,serif";x.fillText("pour avoir obtenu "+score+" / 6 au grand quiz des abeilles",600,640);
 x.font="italic 22px Georgia,serif";x.fillText(new Date().toLocaleDateString("fr-FR"),600,700);
 x.textAlign="right";x.fillText("La Reine, présidente de la ruche",1090,760);
 return c}
async function dl(c){const fn="diplome-happy-culteur.png";
 c.toBlob(async b=>{let d=null;try{d=window.claude?await window.claude.use("downloads"):null}catch(e){}
  if(d){try{await d.save({filename:fn,data:b})}catch(e){}}
  else{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=fn;a.click()}},"image/png")}
const fc=t=>t.f?`<div class="cards">${t.f.map(x=>hv(x[0],x[1],x[2])).join("")}</div>`:"";
function show(i){
 const t=T[i];document.body.style.setProperty("--c",t.c);
 [...nav.children].forEach((b,j)=>b.classList.toggle("on",i===j));
 p.classList.add("out");frise(i);
 setTimeout(()=>{p.innerHTML=`<div class="kicker">${t.k}</div><h1>${t.t}</h1>${body(t)}${fc(t)}`;
  s.innerHTML=`<div class="big">${bee(t.a)}</div><div class="mini m1">${bee(t.m[0])}</div><div class="mini m2">${bee(t.m[1])}</div>`;
  p.classList.remove("out");if(t.quiz)startQuiz();if(t.cards)startCards();
  requestAnimationFrame(()=>setTimeout(()=>p.querySelectorAll(".bar").forEach((b,j)=>{setTimeout(()=>b.style.height=b.dataset.h+"%",j*50);b.onclick=()=>b.classList.toggle("show")}),60));
 },320)}
T.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t.id;b.onclick=()=>{show(i);b.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"})};nav.appendChild(b)});
const trk=document.querySelector(".trk"),rd=document.getElementById("rider");rd.innerHTML=bee("none");
const dots=T.map((t,i)=>{const d=document.createElement("button");d.className="dot";d.title=t.id;d.style.left=i/(T.length-1)*100+"%";d.onclick=()=>{show(i);nav.children[i].scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"})};trk.appendChild(d);return d});
function frise(i){const pc=i/(T.length-1)*100;rd.style.left=pc+"%";trk.style.setProperty("--pg",pc+"%");dots.forEach((d,j)=>d.classList.toggle("d",j<=i))}
const au=document.getElementById("au"),mus=document.getElementById("mus");let want=true;au.volume=.35;
const sync=()=>mus.textContent=au.paused?"♪ Musique OFF":"♪ Musique ON";
au.addEventListener("play",sync);au.addEventListener("pause",sync);sync();
au.play().catch(()=>{});
document.addEventListener("pointerdown",e=>{if(want&&au.paused&&!e.target.closest("#mus"))au.play().catch(()=>{})});
mus.onclick=()=>{if(au.paused){want=true;au.play().catch(()=>{})}else{want=false;au.pause()}};
show(0);
</script></body></html>
